const GRAIN=document.createElement('canvas');GRAIN.width=1080;GRAIN.height=1920;{const g=GRAIN.getContext('2d'),id=g.createImageData(1080,1920),d=id.data;let q=7;for(let i=0;i<d.length;i+=4){q=(q*1103515245+12345)&0x7fffffff;const n=(q>>16)%255;d[i]=d[i+1]=d[i+2]=255;d[i+3]=n<20?14:0}g.putImageData(id,0,0);}
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}

// contorno em leque: 3 vermelhos, abertura no canto inferior esquerdo, cantos redondos
function fan(x,y,w,h,r){
  [[RD,0,70],[RD2,16,120],[RD3,32,170]].forEach(([col,o,gap])=>{
    const X=x-o,Y=y-o,W=w+2*o,H=h+2*o,R=r+o;
    c.beginPath();c.moveTo(X,Y+H-R-gap);c.lineTo(X,Y+R);c.arcTo(X,Y,X+R,Y,R);c.lineTo(X+W-R,Y);c.arcTo(X+W,Y,X+W,Y+R,R);
    c.lineTo(X+W,Y+H-R);c.arcTo(X+W,Y+H,X+W-R,Y+H,R);c.lineTo(X+R+gap,Y+H);
    c.strokeStyle=col;c.lineWidth=o?5:7;c.lineCap='round';c.globalAlpha=o?(o>20?.7:.85):1;c.stroke();c.globalAlpha=1;});
}
function bg(){c.fillStyle=BK;c.fillRect(0,0,1080,1920);

  c.globalAlpha=.5;c.drawImage(GRAIN,0,0);c.globalAlpha=1;}

  c.textAlign='left';c.fillText(`DIA ${String(n).padStart(2,'0')} / 30`,96,236);c.textAlign='right';c.fillText('@cobaia.dev',984,236);
  c.strokeStyle='rgba(242,238,230,.3)';c.lineWidth=3;[[70,200,1,1],[1010,200,-1,1],[70,1720,1,-1],[1010,1720,-1,-1]].forEach(([x,y,a,b])=>{c.beginPath();c.moveTo(x,y+26*b);c.lineTo(x,y);c.lineTo(x+26*a,y);c.stroke()});
  // barra de progresso da série
  c.fillStyle='rgba(242,238,230,.12)';rr(96,1690,888,8,4);c.fill();c.fillStyle=RD;rr(96,1690,888*n/30,8,4);c.fill();}
function dia(n){c.textAlign='center';c.textBaseline='alphabetic';c.font=F.a(132);const a=`DIA ${String(n).padStart(2,'0')}`,b='/30';

// linha com partes [texto, fonte, cor]
function line(parts,y,size){c.textBaseline='alphabetic';let tot=0;const ws=parts.map(([t,f])=>{c.font=F[f](f==='s'?size*1.12:size);return c.measureText(t).width});

function dot(x,y,r=22){c.fillStyle=RD;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='rgba(255,45,45,.25)';c.beginPath();c.arc(x,y,r*1.9,0,7);c.fill();}
function claudeLogo(x,y,s){c.save();c.translate(x-12*s,y-12*s);c.scale(s,s);c.fillStyle=OR;c.fill(new Path2D(CLAUDE_PATH));c.restore();}
